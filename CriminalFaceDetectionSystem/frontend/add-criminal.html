<!DOCTYPE html>
<html>
<head>
<title>Add Criminal - Criminal Face Detection</title>

<style>

body{
margin:0;
font-family:Arial;
background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
color:white;
}

.navbar{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 40px;
background:rgba(0,0,0,0.3);
}

.navbar h2{
margin:0;
}

.navbar a{
color:white;
text-decoration:none;
margin-left:20px;
}

.container{
width:400px;
margin:60px auto;
background:rgba(255,255,255,0.1);
padding:30px;
border-radius:12px;
box-shadow:0 8px 20px rgba(0,0,0,0.3);
backdrop-filter: blur(5px);
}

.container h2{
text-align:center;
margin-bottom:20px;
}

input,select{
width:100%;
padding:10px;
margin:10px 0;
border-radius:6px;
border:none;
}

button{
width:100%;
padding:12px;
background:#1e90ff;
border:none;
border-radius:6px;
color:white;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#187bcd;
}

.message{
text-align:center;
margin-top:15px;
}

</style>

</head>

<body>

<div class="navbar">
<h2>Criminal Face Detection</h2>
<div>
<a href="dashboard.html">Dashboard</a>
<a href="criminal-list.html">Criminal List</a>
<a href="login.html">Logout</a>
</div>
</div>

<div class="container">

<h2>Add Criminal</h2>

<input type="text" id="name" placeholder="Name">

<input type="number" id="age" placeholder="Age">

<select id="gender">
<option value="">Select Gender</option>
<option>Male</option>
<option>Female</option>
</select>

<input type="text" id="crimeType" placeholder="Crime Type">

<input type="text" id="location" placeholder="Location">

<input type="text" id="photo" placeholder="Photo file name">

<button onclick="addCriminal()">Submit</button>

<div class="message" id="msg"></div>

</div>

<script>

async function addCriminal(){

let criminal={
name:document.getElementById("name").value,
age:parseInt(document.getElementById("age").value),
gender:document.getElementById("gender").value,
crimeType:document.getElementById("crimeType").value,
location:document.getElementById("location").value,
photo:document.getElementById("photo").value
}

let res=await fetch("http://localhost:8080/criminal/add",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify(criminal)
})

if(res.ok){
document.getElementById("msg").innerHTML="Criminal Added Successfully"
}
else{
document.getElementById("msg").innerHTML="Error adding criminal"
}

}

</script>

</body>
</html>
